<div class="tabla-wrapper">

  <div class="tabla-header">
    <div class="busqueda-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" [placeholder]="placeholder" [(ngModel)]="textoBusqueda" (input)="buscar()"
        class="input-busqueda" />
    </div>

    <div class="botones-top">
      <button *ngFor="let btn of botonesGlobales" class="btn-tabla" [ngClass]="btn.tipo || 'primary'"
        (click)="emitir(btn.evento)">
        <mat-icon *ngIf="btn.texto.toLowerCase().includes('filtros')">filter_list</mat-icon>
        <mat-icon *ngIf="btn.texto.toLowerCase().includes('nuevo')">person_add</mat-icon>
        {{ btn.texto }}
      </button>
    </div>
  </div>

  <div class="tabla-scroll">
    <table [class.layout-fixed]="layout === 'fixed'">

      <thead>
        <tr>
          <th *ngFor="let col of columnas" [style.width]="col.width">
            {{ col.label }}
          </th>
          <th class="text-center" style="width: 100px;">ACCIONES</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let fila of dataPaginada" [ngClass]="estadoFilaClass(fila.estado)">

          <td *ngFor="let col of columnas" [attr.data-label]="col.label">

            <ng-container *ngIf="col.key === 'estado'; else celdaNormal">
              <span class="estado-badge" [ngClass]="estadoClass(fila[col.key])">
                {{ fila[col.key] }}
              </span>
            </ng-container>

            <ng-template #celdaNormal>
              <ng-container [ngSwitch]="col.key">
                <span *ngSwitchCase="'id_display'" class="id-text">{{ fila[col.key] }}</span>

                <div *ngSwitchCase="'nombre'" class="name-cell">
                  <div class="initial-avatar" [attr.data-letter]="fila['inicial']">
                    {{ fila['inicial'] }}
                  </div>
                  <span class="bold-text">{{ fila[col.key] }}</span>
                </div>

                <span *ngSwitchCase="'correo'" class="email-link">{{ fila[col.key] }}</span>

                <span *ngSwitchDefault class="cell-text">
                  {{ fila[col.key] }}
                </span>
              </ng-container>
            </ng-template>
          </td>

          <td class="text-center" data-label="Acciones">
            <div class="acciones-container">
              <button *ngFor="let btn of botonesAccion" class="btn-accion-fila" [ngClass]="btn.tipo"
                (click)="emitir(btn.evento, fila)">
                <mat-icon *ngIf="btn.texto.toLowerCase() === 'editar'">edit</mat-icon>
                <mat-icon *ngIf="btn.evento === 'eliminar' || btn.evento === 'desactivar'">
                  delete
                </mat-icon>

                <mat-icon *ngIf="btn.texto.toLowerCase() === 'activar'">check_circle</mat-icon>
              </button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

  <div class="tabla-footer">
    <div class="info-paginacion">
      Mostrando <strong>{{ inicioRegistro }} a {{ finRegistro }}</strong> de <strong>{{ totalRegistros }}</strong>
      resultados
    </div>

    <div class="controles-paginacion">
      <button class="btn-page" [disabled]="paginaActual === 1" (click)="cambiarPagina(paginaActual - 1)">
        Anterior
      </button>
      <div class="paginas-list">
        <button *ngFor="let p of paginasTotales" class="btn-page-num" [class.active]="p === paginaActual"
          (click)="cambiarPagina(p)">{{ p }}</button>
      </div>
      <button class="btn-page" [disabled]="paginaActual === totalPaginas" (click)="cambiarPagina(paginaActual + 1)">
        Siguiente
      </button>
    </div>
  </div>
</div>
