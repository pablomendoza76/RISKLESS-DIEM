<div class="admin-topbar">

  <!-- IZQUIERDA -->
  <div class="topbar-left">
    <span class="role-label">
      {{ mensaje }}
    </span>
  </div>

  <!-- DERECHA -->
  <div class="topbar-right">

    <!-- ================= CAMPANA NOTIFICACIONES ================= -->
    <div class="notification-wrapper">

      <div
        class="notification clickable"
        title="Notificaciones"
        (click)="toggleNotificaciones()">

        <mat-icon>notifications</mat-icon>
      </div>

      <!-- MODAL NOTIFICACIONES -->
      <div
        class="notifications-dropdown"
        *ngIf="mostrarNotificaciones">

        <app-modal-notificaciones
          [isOpen]="mostrarNotificaciones">
        </app-modal-notificaciones>

      </div>

    </div>
    <!-- ================= FIN NOTIFICACIONES ================= -->

    <!-- AVATAR -->
    <div class="avatar clickable" (click)="toggleLogout()">
      <span class="avatar-initials">
        {{ iniciales }}
      </span>
    </div>

    <!-- INFO -->
    <div class="user-info">
      <span class="user-name">{{ nombre }}</span>
      <span class="user-role">{{ rol }}</span>
    </div>

    <!-- ================= MODAL LOGOUT ================= -->
    <div
      class="logout-backdrop"
      *ngIf="mostrarLogout">

      <div class="logout-modal">
        <h3>Cerrar sesión</h3>
        <p>¿Deseas cerrar sesión y volver al inicio?</p>

        <div class="logout-actions">
          <button
            class="btn-cancel"
            type="button"
            (click)="cerrarModalLogout()">
            Cancelar
          </button>

          <button
            class="btn-danger"
            type="button"
            (click)="confirmarLogout()">
            Cerrar sesión
          </button>
        </div>
      </div>

    </div>
    <!-- ================= FIN MODAL LOGOUT ================= -->

  </div>

</div>
