<div class="admin-topbar">

  <!-- IZQUIERDA (Saludo estilizado) -->
  <div class="topbar-left">
    <div class="topbar-messages">
      <span class="role-label" *ngIf="mensaje === 'Bienvenido al sistema'">
        {{ mensaje }} <!-- Mantener lógica original -->
      </span>
      <span class="role-label" *ngIf="mensaje !== 'Bienvenido al sistema'">
        {{ mensaje }}
      </span>
      <span class="subtitle-date" *ngIf="subtitulo">
        <mat-icon class="subtitle-icon">calendar_today</mat-icon>
        {{ subtitulo }}
      </span>
    </div>
  </div>

  <!-- DERECHA -->
  <div class="topbar-right">

    <!-- ================= CAMPANA NOTIFICACIONES ================= -->
    <div class="notification-wrapper">

      <div class="notification clickable" title="Notificaciones" (click)="toggleNotificaciones()">

        <mat-icon>notifications_none</mat-icon> <!-- Icono outline más moderno -->
      </div>

      <!-- MODAL NOTIFICACIONES (Dropdown absoluto) -->
      <div class="notifications-dropdown" *ngIf="mostrarNotificaciones">

        <app-modal-notificaciones [isOpen]="mostrarNotificaciones">
        </app-modal-notificaciones>

      </div>

    </div>
    <!-- ================= FIN NOTIFICACIONES ================= -->

    <!-- SEPARADOR VERTICAL (Opcional, si queremos separar notificaciones de usuario) -->
    <div style="width: 1px; height: 24px; background: #e2e8f0; margin: 0 4px;"></div>

    <!-- USUARIO -->
    <div class="user-info text-right">
      <span class="user-name">{{ nombre }}</span>
      <span class="user-role">{{ rol }}</span>
    </div>

    <!-- AVATAR -->
    <div class="avatar clickable" (click)="toggleLogout()">
      <span class="avatar-initials">
        {{ iniciales }}
      </span>
    </div>

    <!-- ================= MODAL LOGOUT ================= -->
    <div class="logout-backdrop" *ngIf="mostrarLogout">

      <div class="logout-modal">
        <h3>Cerrar sesión</h3>
        <p>¿Estás seguro de que deseas salir de tu cuenta?</p>

        <div class="logout-actions">
          <button class="btn-cancel" type="button" (click)="cerrarModalLogout()">
            Cancelar
          </button>

          <button class="btn-danger" type="button" (click)="confirmarLogout()">
            Salir
          </button>
        </div>
      </div>

    </div>
    <!-- ================= FIN MODAL LOGOUT ================= -->

  </div>

</div>
