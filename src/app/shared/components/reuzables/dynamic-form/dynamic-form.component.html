<div class="dynamic-form" [class.is-embedded]="embedded">

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- cabecera -->
    <div class="form-header" *ngIf="titulo">
      <div class="title-group">
        <h2 class="form-title">{{ titulo }}</h2>
        <p>Complete los campos del formulario</p>
      </div>
    </div>

    <!-- cuerpo -->
    <div class="form-body">

      <div
        class="form-field"
        *ngFor="let field of fields"
        [class.full-width]="field.type === 'file' || field.type === 'textarea'">

        <label *ngIf="field.type !== 'checkbox'">
          {{ field.label }}
        </label>

        <div class="input-wrapper">

          <!-- inputs -->
          <input
            *ngIf="
              field.type === 'text' ||
              field.type === 'number' ||
              field.type === 'email' ||
              field.type === 'password' ||
              field.type === 'date'
            "
            [type]="field.type"
            [formControlName]="field.name"
            [class.invalid]="
              form.get(field.name)?.invalid &&
              form.get(field.name)?.touched
            "
          />

          <!-- textarea -->
          <textarea
            *ngIf="field.type === 'textarea'"
            [formControlName]="field.name"
            [attr.maxLength]="field.maxLength || 200"
            rows="4"
            [class.invalid]="
              form.get(field.name)?.invalid &&
              form.get(field.name)?.touched
            ">
          </textarea>

          <!-- contador -->
          <small
            class="char-counter"
            *ngIf="field.type === 'textarea'">
            {{ form.get(field.name)?.value?.length || 0 }}/{{ field.maxLength || 200 }}
          </small>

          <!-- select -->
          <select
            *ngIf="field.type === 'select'"
            [formControlName]="field.name"
            [class.invalid]="
              form.get(field.name)?.invalid &&
              form.get(field.name)?.touched
            ">
            <option value="">Seleccione</option>
            <option *ngFor="let opt of field.options" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>

          <!-- checkbox -->
          <label
            *ngIf="field.type === 'checkbox'"
            class="checkbox-wrapper">
            <input
              type="checkbox"
              [formControlName]="field.name"
            />
            {{ field.label }}
          </label>

          <!-- file -->
          <div
            *ngIf="field.type === 'file'"
            class="upload-area"
            (click)="fileInput.click()">

            <p>Haga clic para seleccionar archivos</p>

            <button type="button" class="btn-choose-files">
              Elegir archivos
            </button>

            <input
              #fileInput
              type="file"
              multiple
              hidden
              (change)="onFileChange($event, field.name)"
            />
          </div>

        </div>

        <!-- archivos cargados -->
        <div
          class="uploaded-files"
          *ngIf="field.type === 'file' && selectedFiles[field.name]?.length">

          <div
            class="file-item"
            *ngFor="let file of selectedFiles[field.name]; let i = index">

            <span class="file-name">
              {{ file.name }}
            </span>

            <button
              type="button"
              class="remove-file"
              (click)="selectedFiles[field.name].splice(i, 1)">
              Quitar
            </button>

          </div>
        </div>

        <!-- errores -->
        <small
          class="error"
          *ngIf="
            form.get(field.name)?.errors?.['required'] &&
            form.get(field.name)?.touched
          ">
          Campo obligatorio
        </small>

        <small
          class="error"
          *ngIf="
            field.type === 'email' &&
            form.get(field.name)?.errors?.['email'] &&
            form.get(field.name)?.touched
          ">
          Correo electrónico inválido
        </small>

        <small
          class="error"
          *ngIf="
            field.type === 'email' &&
            form.get(field.name)?.errors?.['pattern'] &&
            form.get(field.name)?.touched
          ">
          El correo debe terminar en .com
        </small>

      </div>
    </div>

    <!-- acciones -->
    <div class="form-actions">
      <button
        type="button"
        class="btn-cancel"
        (click)="onCancelar()">
        Cancelar
      </button>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="form.invalid">
        Guardar
      </button>
    </div>

  </form>
</div>
