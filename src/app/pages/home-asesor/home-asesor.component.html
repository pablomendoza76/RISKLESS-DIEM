<div class="home-layout">

  <!-- COLUMNA IZQUIERDA -->
  <aside class="sidebar-area">
    <app-sidebar [title]="sidebarTitle" [items]="sidebarItems" (logout)="cerrarSesion()">
    </app-sidebar>
  </aside>

  <!-- COLUMNA DERECHA -->
  <main class="main-area">

    <!-- FILA SUPERIOR -->
    <header class="topbar-area">
      <app-admin-topbar mensaje="BIENVENIDO AL PANEL DE GESTIÓN" [nombre]="nombreUsuario" [rol]="rolUsuario"
        [iniciales]="inicialesUsuario" [subtitulo]="subtituloFecha" (logout)="cerrarSesion()">
      </app-admin-topbar>
    </header>

    <!-- FILA INFERIOR (DINÁMICA) -->
    <section class="content-area">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
