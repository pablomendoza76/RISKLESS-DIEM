<div class="pedidos-container">

  <!-- ================= HEADER ================= -->
  <div class="header-seccion">

    <!-- GRUPO IZQUIERDO: TÍTULO -->
    <div class="title-group">
      <h2>Listado de Pedidos</h2>
      <p class="subtitle">Seguimiento de solicitudes y trámites en curso.</p>
    </div>

    <!-- GRUPO DERECHO: CARD TOTAL -->
    <div class="total-badge-card">
      <div class="card-content">
        <strong>{{ mapper.totalPedidos }}</strong>
        <span>Total Pedidos</span>
      </div>
      <div class="trend-badge">
        <span class="material-icons">trending_up</span> +18.5%
      </div>
    </div>

  </div>

  <!-- ================= TABLA ================= -->
  <div class="table-wrapper">
    <app-tabla-dinamica [columnas]="mapper.columnas" [data]="mapper.pedidos" [botones]="mapper.botones"
      [placeholder]="'Buscar por Bien, Asegurado, Estado o Fecha...'" [itemsPorPagina]="6" [layout]="'fixed'"
      (accion)="mapper.manejarAccion($event)">
    </app-tabla-dinamica>
  </div>

  <!-- ================= FORMULARIO ================= -->
  <app-dynamic-form *ngIf="mapper.mostrarFormulario" [titulo]="mapper.modoFormulario === 'crear'
    ? 'Nuevo pedido'
    : 'Editar pedido'" [fields]="mapper.fields" [initialData]="mapper.pedidoSeleccionado"
    (valueChange)="mapper.manejarCambioFormulario($event)" (formSubmit)="mapper.recibirFormulario($event.value)"
    (filesSelected)="mapper.archivos = $event" (cancelar)="mapper.cerrarFormulario()">
  </app-dynamic-form>


</div>
