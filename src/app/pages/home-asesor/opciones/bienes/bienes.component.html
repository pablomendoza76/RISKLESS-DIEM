<div class="bienes-container">

  <!-- ================= HEADER ================= -->
  <div class="header-seccion">

    <!-- GRUPO IZQUIERDO: TÍTULO -->
    <div class="title-group">
      <h2>Listado de Bienes</h2>
      <p class="subtitle">Administra los bienes asegurados de tu cartera.</p>
    </div>

    <!-- GRUPO DERECHO: CARD TOTAL -->
    <div class="total-badge-card">
      <div class="card-content">
        <strong>{{ mapper.totalBienes }}</strong>
        <span>Total Bienes</span>
      </div>
      <div class="trend-badge">
        <span class="material-icons">trending_up</span> +5.7%
      </div>
    </div>

  </div>

  <!-- ================= TABLA ================= -->
  <div class="table-wrapper">
    <app-tabla-dinamica [columnas]="mapper.columnas" [data]="mapper.bienes" [botones]="mapper.botones"
      [placeholder]="'Buscar por N°Serie, Tipo, Año Fabricación o Antiguedad...'" [itemsPorPagina]="6"
      [layout]="'fixed'" (accion)="mapper.manejarAccion($event)">
    </app-tabla-dinamica>
  </div>

  <!-- ================= FORMULARIO ================= -->
  <app-dynamic-form *ngIf="mapper.mostrarFormulario"
    [titulo]="mapper.modoFormulario === 'crear' ? 'Nuevo bien' : 'Editar bien'" [fields]="mapper.fields"
    [initialData]="mapper.bienSeleccionado" (formSubmit)="mapper.recibirFormulario($event)"
    (cancelar)="mapper.cerrarFormulario()">
  </app-dynamic-form>

</div>
